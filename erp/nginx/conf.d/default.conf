# Production TLS entrypoint. Do not serve or cache application static files here;
# every application request is forwarded to its frontend container.

server {
    listen 80;
    listen [::]:80;
    server_name
        erp.sztekeluo.com www.erp.sztekeluo.com
        oms.sztekeluo.com www.oms.sztekeluo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erp.sztekeluo.com www.erp.sztekeluo.com;

    ssl_certificate /etc/letsencrypt/live/erp.sztekeluo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.sztekeluo.com/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $erp_web erp-web;
        proxy_pass http://$erp_web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oms.sztekeluo.com www.oms.sztekeluo.com;

    ssl_certificate /etc/letsencrypt/live/oms.sztekeluo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oms.sztekeluo.com/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $oms_web oms-web;
        proxy_pass http://$oms_web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
