# 生产入口反代（erp-nginx）。静态资源不要在这里缓存，一律转到前端容器。
# 证书：certbot certonly --webroot -w /var/www/certbot -d erp.sztekeluo.com -d www.erp.sztekeluo.com
# 续期：certbot renew --quiet（systemd timer 或 cron 每天）

server {
    listen 80;
    listen [::]:80;
    server_name erp.sztekeluo.com www.erp.sztekeluo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erp.sztekeluo.com www.erp.sztekeluo.com;

    ssl_certificate /etc/letsencrypt/live/erp.sztekeluo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.sztekeluo.com/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $erp_web erp-web;
        proxy_pass http://$erp_web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
