server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — avoid stale upstream IP after container recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 用户与权限管理仍由 NestJS 提供完整接口。避免迁移中的 Java 鉴权服务
    # 将 /users 当作静态资源而返回 500。
    location ~ ^/api/(users|permissions|suppliers)(/|$) {
        set $legacy_backend_host backend;
        proxy_pass http://$legacy_backend_host:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        set $gateway_host erp-gateway;
        proxy_pass http://$gateway_host:9000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    location /takealot-monitor/ {
        proxy_pass http://takealot-monitor:3456/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
