# 国内拉取 Docker Hub 失败时，已默认走 DaoCloud 镜像加速
# 若仍失败，请在 Docker Desktop → Settings → Docker Engine 配置 registry-mirrors（见下方说明）

x-build-args: &build-args
  DOCKER_REGISTRY: docker.m.daocloud.io/library/

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ERP_MYSQL_ROOT_PASSWORD:?Set ERP_MYSQL_ROOT_PASSWORD in .env}
      # 单一业务库：ERP 表 + OMS 的 oms_* 表共用 takealot_erp（勿对 OMS 执行 prisma db push）
      MYSQL_DATABASE: takealot_erp
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3306 常被本地 MySQL 占用，映射到 3307 避免冲突
      - "3307:3306"
    volumes:
      - erp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        <<: *build-args
    container_name: erp-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: mysql://root:${ERP_MYSQL_ROOT_PASSWORD:?Set ERP_MYSQL_ROOT_PASSWORD in .env}@mysql:3306/takealot_erp
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      AUTO_SCHEMA_SYNC: ${AUTO_SCHEMA_SYNC:-false}
      TAKEALOT_PROXY_URL: http://takealot-monitor:3456
    ports:
      # 宿主机 3000 常被本地 npm run start:dev 占用，映射到 3001
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      takealot-monitor:
        condition: service_started

  takealot-monitor:
    build:
      context: ./takealot-monitor
      args:
        <<: *build-args
    container_name: erp-takealot-monitor
    restart: unless-stopped
    ports:
      - "3456:3456"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        <<: *build-args
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - takealot-monitor

  # 一次性初始化演示数据：docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
      args:
        <<: *build-args
    environment:
      DATABASE_URL: mysql://root:${ERP_MYSQL_ROOT_PASSWORD:?Set ERP_MYSQL_ROOT_PASSWORD in .env}@mysql:3306/takealot_erp
    command: npm run seed
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

volumes:
  erp_mysql_data:
