# ERP production stack. OMS joins the same external network from ../oms/docker-compose.yml.
# The deploy workflow creates takealot-production before starting either project.

x-build-args: &build-args
  DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io/library/}
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

services:
  mysql:
    image: ${DOCKER_REGISTRY:-docker.io/library/}mysql:8.0
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ERP_MYSQL_ROOT_PASSWORD:?Set ERP_MYSQL_ROOT_PASSWORD in erp/.env}
      MYSQL_DATABASE: takealot_erp
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${ERP_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - erp_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - production

  erp-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        <<: *build-args
    image: takealot/erp-api:production
    container_name: erp-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LISTEN_HOST: 0.0.0.0
      DATABASE_URL: mysql://root:${ERP_MYSQL_ROOT_PASSWORD}@mysql:3306/takealot_erp
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in erp/.env (at least 32 characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://erp.sztekeluo.com,https://www.erp.sztekeluo.com}
      AUTO_SCHEMA_SYNC: ${AUTO_SCHEMA_SYNC:-false}
      OMS_WEBHOOK_URL: http://oms-api:3001/api/erp/webhooks/events
      OMS_WEBHOOK_SECRET: ${OMS_WEBHOOK_SECRET:?Set OMS_WEBHOOK_SECRET in erp/.env}
      OMS_INTERNAL_TOKEN: ${OMS_INTERNAL_TOKEN:?Set OMS_INTERNAL_TOKEN in erp/.env}
      TAKEALOT_PROXY_URL: http://takealot-monitor:3456
    ports:
      - "127.0.0.1:${ERP_BACKEND_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/auth/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - production
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  erp-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        <<: *build-args
    image: takealot/erp-web:production
    container_name: erp-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ERP_FRONTEND_PORT:-5180}:8080"
    depends_on:
      erp-api:
        condition: service_healthy
    networks:
      - production
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  nginx:
    image: ${DOCKER_REGISTRY:-docker.io/library/}nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      erp-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - production
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
          sleep 12h & wait $$!;
        done
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    networks:
      - production
    security_opt:
      - no-new-privileges:true

networks:
  production:
    name: takealot-production
    external: true

volumes:
  erp_mysql_data:
