# 本目录 compose 已迁移至仓库根目录 `docker-compose.yml`（含 ERP + OMS）。
# 若只需 ERP 栈，可在根目录执行：
#   docker compose up erp-backend erp-frontend mysql

# 国内镜像前缀示例见根目录 docker.env.example 中的 DOCKER_REGISTRY

x-build-args: &build-args
  DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io/library/}

services:
  mysql:
    image: ${DOCKER_REGISTRY:-docker.io/library/}mysql:8.0
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ERP_MYSQL_ROOT_PASSWORD:?Set ERP_MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: takealot_erp
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - erp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        <<: *build-args
    container_name: erp-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      LISTEN_HOST: 0.0.0.0
      DATABASE_URL: mysql://root:${ERP_MYSQL_ROOT_PASSWORD}@mysql:3306/takealot_erp
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5180}
      AUTO_SCHEMA_SYNC: ${AUTO_SCHEMA_SYNC:-false}
      TAKEALOT_PROXY_URL: http://takealot-monitor:3456
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      default:
        aliases:
          - erp-api

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        <<: *build-args
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "5180:8080"
    depends_on:
      backend:
        condition: service_started

  takealot-monitor:
    profiles: ["monitor"]
    build:
      context: ../store-monitor
      args:
        <<: *build-args
    container_name: erp-takealot-monitor
    restart: unless-stopped
    environment:
      LISTEN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3456:3456"

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder-dev
      args:
        <<: *build-args
    environment:
      DATABASE_URL: mysql://root:${ERP_MYSQL_ROOT_PASSWORD}@mysql:3306/takealot_erp
    command: npm run seed
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

volumes:
  erp_mysql_data:
