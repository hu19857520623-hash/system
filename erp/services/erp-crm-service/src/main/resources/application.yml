server:
  port: 9102
spring:
  application:
    name: erp-crm-service
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

erp:
  legacy:
    base-url: ${LEGACY_BACKEND_URL:http://localhost:3001}
