name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Quality gates
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '175.178.50.202 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJTOOSCreL9KknlpIN9qdGHtWKyEFAjon4Bil4MP4CpJ' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync application source
        run: |
          rsync -az \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='*/.env' \
            --exclude='*/node_modules/' \
            --exclude='*/dist/' \
            --exclude='.codex-tmp/' \
            --exclude='tmp/' \
            -e 'ssh -i ~/.ssh/deploy_key -o BatchMode=yes' \
            ./ ubuntu@175.178.50.202:/opt/system/

      - name: Build and restart ERP and OMS
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes ubuntu@175.178.50.202 \
            'cat > /tmp/system-production-deploy.sh && bash /tmp/system-production-deploy.sh' <<'REMOTE'
          set -Eeuo pipefail
          trap 'echo "DEPLOY_FAIL line=$LINENO cmd=$BASH_COMMAND status=$?" >&2' ERR

          exec 9>/tmp/system-production-deploy.lock
          flock -n 9 || { echo 'Another production deployment is running.'; exit 1; }

          load_env_file() {
            if [ -f "$1" ]; then
              set -a
              # shellcheck disable=SC1090
              . "$1"
              set +a
            fi
          }

          upsert_env_value() {
            local env_file="$1"
            local key="$2"
            local value="$3"
            local tmp_file
            touch "$env_file"
            tmp_file="$(mktemp "${env_file}.XXXXXX")"
            grep -v "^${key}=" "$env_file" > "$tmp_file" || true
            printf '%s=%s\n' "$key" "$value" >> "$tmp_file"
            mv "$tmp_file" "$env_file"
          }

          load_env_file /opt/system/.env
          load_env_file /opt/system/erp/.env
          erp_internal_token="${OMS_INTERNAL_TOKEN:-}"
          load_env_file /opt/system/oms/.env
          oms_internal_token="${OMS_INTERNAL_TOKEN:-}"
          oms_jwt_secret_current="${OMS_JWT_SECRET:-}"

          if [ "${#erp_internal_token}" -lt 32 ] \
            || [ "${#oms_internal_token}" -lt 32 ] \
            || [ "$erp_internal_token" != "$oms_internal_token" ]; then
            shared_internal_token="$(openssl rand -hex 32)"
            upsert_env_value /opt/system/erp/.env OMS_INTERNAL_TOKEN "$shared_internal_token"
            upsert_env_value /opt/system/oms/.env OMS_INTERNAL_TOKEN "$shared_internal_token"
            export OMS_INTERNAL_TOKEN="$shared_internal_token"
            echo 'Rotated and synchronized OMS_INTERNAL_TOKEN.'
          fi

          if [ "${#oms_jwt_secret_current}" -lt 32 ]; then
            oms_jwt_secret="$(openssl rand -hex 32)"
            upsert_env_value /opt/system/oms/.env OMS_JWT_SECRET "$oms_jwt_secret"
            export OMS_JWT_SECRET="$oms_jwt_secret"
            echo 'Rotated OMS_JWT_SECRET because the configured value was too short.'
          fi

          test -n "${ERP_MYSQL_ROOT_PASSWORD:-}" || { echo 'ERP_MYSQL_ROOT_PASSWORD missing on server'; exit 1; }
          test -n "${OMS_INTERNAL_TOKEN:-}" || { echo 'OMS_INTERNAL_TOKEN missing on server'; exit 1; }
          test -n "${OMS_WEBHOOK_SECRET:-}" || { echo 'OMS_WEBHOOK_SECRET missing on server'; exit 1; }

          # rsync intentionally preserves server-only files such as .env, so
          # remove obsolete nginx snippets from this version-controlled folder.
          find /opt/system/erp/nginx/conf.d -maxdepth 1 -type f \
            -name '*.conf' ! -name 'default.conf' -delete

          # ERP, OMS, nginx and the monitor resolve each other on one stable
          # cross-project network. Creation is idempotent across deployments.
          docker network inspect takealot-production >/dev/null 2>&1 \
            || docker network create takealot-production >/dev/null

          # Apply SQL from the rsynced host files. Do not rely on image COPY cache,
          # which can miss newly added prisma/scripts/*.sql.
          cd /opt/system/erp
          docker compose up -d mysql </dev/null

          export ERP_BACKUP_DIR="${ERP_BACKUP_DIR:-/opt/system/backups}"
          mkdir -p "$ERP_BACKUP_DIR"
          chmod 700 "$ERP_BACKUP_DIR"
          upsert_env_value /opt/system/erp/.env ERP_BACKUP_DIR "$ERP_BACKUP_DIR"
          docker compose up -d --no-deps mysql-backup </dev/null

          echo '=== Build OMS ==='
          cd /opt/system/oms
          docker compose build oms-api oms-web </dev/null

          echo '=== Build ERP ==='
          cd /opt/system/erp
          docker compose build erp-api erp-web </dev/null

          echo '=== Apply outbound phase1 schema ==='
          docker compose run -T --rm --no-deps --entrypoint npx erp-api \
            prisma db execute --file prisma/scripts/migrate_outbound_phase1_efficiency.sql </dev/null

          echo '=== Repair WMS loop schema ==='
          repair_sql="${PWD}/backend/prisma/scripts/migrate_wms_loop_schema_repair.sql"
          test -f "$repair_sql" || { echo "Missing $repair_sql"; exit 1; }
          mysql_pw="$(docker compose exec -T mysql printenv MYSQL_ROOT_PASSWORD </dev/null | tr -d '\r\n')"
          test -n "$mysql_pw" || { echo 'mysql container missing MYSQL_ROOT_PASSWORD'; exit 1; }
          for _ in $(seq 1 30); do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -p"$mysql_pw" --silent </dev/null >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          cat "$repair_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --batch takealot_erp

          echo '=== Apply WMS management loop schema ==='
          wms_mgmt_sql="${PWD}/backend/prisma/scripts/migrate_wms_management_loop.sql"
          test -f "$wms_mgmt_sql" || { echo "Missing $wms_mgmt_sql"; exit 1; }
          cat "$wms_mgmt_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --batch takealot_erp

          echo '=== Restore inbound fee rule columns ==='
          inbound_fee_sql="${PWD}/backend/prisma/scripts/migrate_inbound_fee_restore.sql"
          test -f "$inbound_fee_sql" || { echo "Missing $inbound_fee_sql"; exit 1; }
          cat "$inbound_fee_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --batch takealot_erp

          echo '=== Apply Anheng WCS schema ==='
          anheng_sql="${PWD}/backend/prisma/scripts/migrate_anheng_wcs.sql"
          test -f "$anheng_sql" || { echo "Missing $anheng_sql"; exit 1; }
          cat "$anheng_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --batch takealot_erp

          echo '=== Apply user workstation ==='
          workstation_sql="${PWD}/backend/prisma/scripts/migrate_user_workstation.sql"
          test -f "$workstation_sql" || { echo "Missing $workstation_sql"; exit 1; }
          cat "$workstation_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --default-character-set=utf8mb4 --batch takealot_erp

          echo '=== Apply warehouse total volume ==='
          volume_sql="${PWD}/backend/prisma/scripts/migrate_warehouse_total_volume.sql"
          test -f "$volume_sql" || { echo "Missing $volume_sql"; exit 1; }
          cat "$volume_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --batch takealot_erp

          echo '=== Apply office/warehouse job titles ==='
          role_side_sql="${PWD}/backend/prisma/scripts/migrate_role_office_warehouse.sql"
          test -f "$role_side_sql" || { echo "Missing $role_side_sql"; exit 1; }
          cat "$role_side_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --default-character-set=utf8mb4 --batch takealot_erp

          echo '=== Apply purchase manager job title ==='
          purchase_mgr_sql="${PWD}/backend/prisma/scripts/migrate_purchase_manager_role.sql"
          test -f "$purchase_mgr_sql" || { echo "Missing $purchase_mgr_sql"; exit 1; }
          cat "$purchase_mgr_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --default-character-set=utf8mb4 --batch takealot_erp

          echo '=== Apply warehouse job titles ==='
          warehouse_jobs_sql="${PWD}/backend/prisma/scripts/migrate_warehouse_job_titles.sql"
          test -f "$warehouse_jobs_sql" || { echo "Missing $warehouse_jobs_sql"; exit 1; }
          cat "$warehouse_jobs_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --default-character-set=utf8mb4 --batch takealot_erp

          echo '=== Sync dashboard and role permissions ==='
          dash_perm_sql="${PWD}/backend/prisma/scripts/migrate_dashboard_permissions.sql"
          test -f "$dash_perm_sql" || { echo "Missing $dash_perm_sql"; exit 1; }
          cat "$dash_perm_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --default-character-set=utf8mb4 --batch takealot_erp

          echo '=== Backfill empty lead follow sales ==='
          follow_sales_sql="${PWD}/backend/prisma/scripts/fix_lead_empty_follow_sales.sql"
          test -f "$follow_sales_sql" || { echo "Missing $follow_sales_sql"; exit 1; }
          cat "$follow_sales_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --default-character-set=utf8mb4 --batch takealot_erp

          echo '=== Backfill missing lead assignees ==='
          assignee_sql="${PWD}/backend/prisma/scripts/fix_lead_missing_assignee.sql"
          test -f "$assignee_sql" || { echo "Missing $assignee_sql"; exit 1; }
          cat "$assignee_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --default-character-set=utf8mb4 --batch takealot_erp

          echo '=== Unify lead follow-sales aliases ==='
          unify_sales_sql="${PWD}/backend/prisma/scripts/unify_lead_follow_sales_aliases.sql"
          test -f "$unify_sales_sql" || { echo "Missing $unify_sales_sql"; exit 1; }
          cat "$unify_sales_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --default-character-set=utf8mb4 --batch takealot_erp

          echo '=== Build store-monitor ==='
          cd /opt/system/store-monitor
          docker build -t takealot/store-monitor:production . </dev/null

          cd /opt/system/oms
          if ! docker compose up -d --no-deps oms-api oms-web </dev/null; then
            docker logs --tail 100 oms-api || true
            exit 1
          fi

          bootstrap_user="${OMS_BOOTSTRAP_ADMIN_USERNAME:-omsadmin}"
          bootstrap_pass="${OMS_BOOTSTRAP_ADMIN_PASSWORD:-DevAdmin123!}"
          docker compose exec -T \
            -e "OMS_BOOTSTRAP_ADMIN_USERNAME=${bootstrap_user}" \
            -e "OMS_BOOTSTRAP_ADMIN_PASSWORD=${bootstrap_pass}" \
            oms-api npx tsx server/reset-bootstrap-admin-cli.ts </dev/null

          cd /opt/system/erp
          docker rm -f takealot-monitor >/dev/null 2>&1 || true
          docker compose up -d --no-deps erp-api erp-web </dev/null

          docker run -d \
            --name takealot-monitor \
            --restart unless-stopped \
            --network takealot-production \
            -e LISTEN_HOST=0.0.0.0 \
            -e PORT=3456 \
            takealot/store-monitor:production >/dev/null

          # Replace the legacy entrypoint name and start TLS + renewal from the
          # version-controlled production Compose configuration.
          docker rm -f erp-nginx >/dev/null 2>&1 || true
          docker compose up -d --no-deps nginx </dev/null

          nginx_ready=false
          for _ in $(seq 1 12); do
            if docker compose exec -T nginx nginx -t </dev/null >/dev/null 2>&1 \
              && curl --silent --show-error --max-time 5 \
                http://127.0.0.1/.well-known/acme-challenge/readiness >/dev/null; then
              nginx_ready=true
              break
            fi
            sleep 2
          done
          if [ "$nginx_ready" != true ]; then
            docker logs --tail 100 nginx || true
            echo 'nginx did not expose the ACME HTTP endpoint.' >&2
            exit 1
          fi

          certbot_contact=(--register-unsafely-without-email)
          if [ -n "${CERTBOT_EMAIL:-}" ]; then
            certbot_contact=(--email "$CERTBOT_EMAIL")
          fi

          ensure_certificate_domains() {
            local cert_name="$1"
            shift
            local domains=("$@")
            local domain=''
            local certbot_domains=()

            for domain in "${domains[@]}"; do
              certbot_domains+=(-d "$domain")
            done

            for attempt in 1 2 3; do
              if docker compose run -T --rm --no-deps --entrypoint certbot certbot \
                certonly --webroot --webroot-path=/var/www/certbot \
                --cert-name "$cert_name" --expand --non-interactive --agree-tos \
                "${certbot_contact[@]}" "${certbot_domains[@]}" </dev/null; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              echo "Certbot attempt ${attempt} failed; retrying after DNS propagation delay."
              sleep 15
            done
          }

          ensure_certificate_domains www.erp.sztekeluo.com \
            erp.sztekeluo.com www.erp.sztekeluo.com
          ensure_certificate_domains www.oms.sztekeluo.com \
            oms.sztekeluo.com www.oms.sztekeluo.com
          # Recreate the public TLS process so it opens the renewed certificate
          # files instead of continuing to serve the certificates loaded at boot.
          docker compose restart nginx </dev/null
          docker compose up -d --no-deps certbot </dev/null

          wait_healthy() {
            local container="$1"
            local status=''
            for _ in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              if [ "$status" = healthy ] || [ "$status" = running ]; then
                echo "$container: $status"
                return 0
              fi
              if [ "$status" = unhealthy ] || [ "$status" = exited ] || [ "$status" = dead ]; then
                docker logs --tail 100 "$container" || true
                return 1
              fi
              sleep 5
            done
            echo "$container did not become healthy (last status: $status)"
            docker logs --tail 100 "$container" || true
            return 1
          }

          wait_healthy oms-api
          wait_healthy oms-web
          wait_healthy erp-api
          wait_healthy erp-web
          wait_healthy erp-mysql-backup

          cd /opt/system/erp
          echo '=== Best-effort customer import via running erp-api ==='
          if [ -f backend/data/customers-import.json ]; then
            load_env_file /opt/system/erp/.env
            erp_api_cid="$(docker compose ps -q erp-api)"
            docker exec "$erp_api_cid" mkdir -p /app/data </dev/null || true
            docker cp backend/data/customers-import.json "${erp_api_cid}:/app/data/customers-import.json"
            docker exec -u 0 "$erp_api_cid" chmod 644 /app/data/customers-import.json </dev/null
            if import_json="$(
              curl --fail --silent --show-error --max-time 600 \
                -X POST https://www.erp.sztekeluo.com/api/customers/oms/import-legacy \
                -H "Content-Type: application/json" \
                -H "x-oms-internal-token: ${OMS_INTERNAL_TOKEN}" \
                -d '{}'
            )"; then
              printf '%s\n' "$import_json"
              IMPORT_JSON="$import_json" python3 -c "import json,os; payload=json.loads(os.environ['IMPORT_JSON']); data=payload.get('data') or payload; keys=('total','created','updated','failed','linked'); print('import result:', {k: data.get(k) for k in keys})" \
                || echo 'Customer import response could not be summarized; deployment will continue.'
            else
              echo 'Customer import returned an error; deployment health checks will continue.'
            fi
          else
            echo 'Customer import source is absent; deployment health checks will continue.'
          fi

          wait_healthy takealot-monitor
          wait_healthy nginx

          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://www.oms.sztekeluo.com/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://www.erp.sztekeluo.com/api/auth/health >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://www.erp.sztekeluo.com/takealot-monitor/health >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://oms.sztekeluo.com/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://erp.sztekeluo.com/api/auth/health >/dev/null

          latest_backup=""
          for _ in $(seq 1 30); do
            latest_backup="$(ls -1t "${ERP_BACKUP_DIR}"/takealot_erp-*.sql.gz 2>/dev/null | head -n 1 || true)"
            if [ -n "$latest_backup" ] && [ -s "$latest_backup" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$latest_backup" ] || [ ! -s "$latest_backup" ]; then
            docker logs --tail 80 erp-mysql-backup || true
            echo 'Scheduled MySQL backup has not produced a dump yet.' >&2
            exit 1
          fi
          echo "Latest MySQL backup: ${latest_backup} ($(wc -c < "$latest_backup") bytes)"
          REMOTE

      - name: Verify public TLS certificates
        run: |
          set -Eeuo pipefail

          verify_certificate_sans() {
            local host="$1"
            shift
            local certificate=''
            local expected_domain=''

            certificate="$(
              openssl s_client -servername "$host" -connect "${host}:443" </dev/null 2>/dev/null \
                | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
            )"
            printf '%s\n' "=== ${host} ===" "$certificate"

            for expected_domain in "$@"; do
              grep -Fq "DNS:${expected_domain}" <<<"$certificate" || {
                echo "Certificate served by ${host} is missing DNS:${expected_domain}" >&2
                return 1
              }
            done
          }

          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            https://erp.sztekeluo.com/api/auth/health >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            https://oms.sztekeluo.com/ >/dev/null
          verify_certificate_sans erp.sztekeluo.com \
            erp.sztekeluo.com www.erp.sztekeluo.com
          verify_certificate_sans oms.sztekeluo.com \
            oms.sztekeluo.com www.oms.sztekeluo.com

      - name: Deployment summary
        run: |
          echo "### Production deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ERP: https://www.erp.sztekeluo.com/" >> "$GITHUB_STEP_SUMMARY"
          echo "- OMS: https://www.oms.sztekeluo.com/" >> "$GITHUB_STEP_SUMMARY"
          echo "- MySQL backup: daily dump under \`/opt/system/backups\` (14-day retention)" >> "$GITHUB_STEP_SUMMARY"
