name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '175.178.50.202 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJTOOSCreL9KknlpIN9qdGHtWKyEFAjon4Bil4MP4CpJ' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync application source
        run: |
          rsync -az \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='*/.env' \
            --exclude='*/node_modules/' \
            --exclude='*/dist/' \
            --exclude='.codex-tmp/' \
            --exclude='tmp/' \
            -e 'ssh -i ~/.ssh/deploy_key -o BatchMode=yes' \
            ./ ubuntu@175.178.50.202:/opt/system/

      - name: Build and restart ERP and OMS
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes ubuntu@175.178.50.202 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          exec 9>/tmp/system-production-deploy.lock
          flock -n 9 || { echo 'Another production deployment is running.'; exit 1; }

          load_env_file() {
            if [ -f "$1" ]; then
              set -a
              # shellcheck disable=SC1090
              . "$1"
              set +a
            fi
          }

          load_env_file /opt/system/.env
          load_env_file /opt/system/erp/.env
          load_env_file /opt/system/oms/.env
          test -n "${ERP_MYSQL_ROOT_PASSWORD:-}" || { echo 'ERP_MYSQL_ROOT_PASSWORD missing on server'; exit 1; }
          test -n "${OMS_INTERNAL_TOKEN:-}" || { echo 'OMS_INTERNAL_TOKEN missing on server'; exit 1; }
          test -n "${OMS_WEBHOOK_SECRET:-}" || { echo 'OMS_WEBHOOK_SECRET missing on server'; exit 1; }

          # ERP, OMS, nginx and the monitor resolve each other on one stable
          # cross-project network. Creation is idempotent across deployments.
          docker network inspect takealot-production >/dev/null 2>&1 \
            || docker network create takealot-production >/dev/null

          # Apply SQL from the rsynced host files. Do not rely on image COPY cache,
          # which can miss newly added prisma/scripts/*.sql.
          cd /opt/system/erp
          docker compose up -d mysql

          echo '=== Build OMS ==='
          cd /opt/system/oms
          docker compose build oms-api oms-web

          echo '=== Build ERP ==='
          cd /opt/system/erp
          docker compose build erp-api erp-web

          echo '=== Apply outbound phase1 schema ==='
          docker compose run -T --rm --no-deps --entrypoint npx erp-api \
            prisma db execute --file prisma/scripts/migrate_outbound_phase1_efficiency.sql </dev/null

          echo '=== Repair WMS loop schema ==='
          repair_sql="${PWD}/backend/prisma/scripts/migrate_wms_loop_schema_repair.sql"
          test -f "$repair_sql" || { echo "Missing $repair_sql"; exit 1; }
          mysql_pw="$(docker compose exec -T mysql printenv MYSQL_ROOT_PASSWORD </dev/null | tr -d '\r\n')"
          test -n "$mysql_pw" || { echo 'mysql container missing MYSQL_ROOT_PASSWORD'; exit 1; }
          for _ in $(seq 1 30); do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -p"$mysql_pw" --silent </dev/null >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          cat "$repair_sql" | docker compose exec -T mysql mysql -uroot -p"$mysql_pw" --batch takealot_erp

          echo '=== Build store-monitor ==='
          cd /opt/system/store-monitor
          docker build -t takealot/store-monitor:production .

          cd /opt/system/oms
          docker compose up -d --no-deps oms-api oms-web

          bootstrap_user="${OMS_BOOTSTRAP_ADMIN_USERNAME:-omsadmin}"
          bootstrap_pass="${OMS_BOOTSTRAP_ADMIN_PASSWORD:-DevAdmin123!}"
          docker compose exec -T \
            -e "OMS_BOOTSTRAP_ADMIN_USERNAME=${bootstrap_user}" \
            -e "OMS_BOOTSTRAP_ADMIN_PASSWORD=${bootstrap_pass}" \
            oms-api npx tsx server/reset-bootstrap-admin-cli.ts </dev/null

          cd /opt/system/erp
          docker rm -f takealot-monitor >/dev/null 2>&1 || true
          docker compose up -d --no-deps erp-api erp-web

          docker run -d \
            --name takealot-monitor \
            --restart unless-stopped \
            --network takealot-production \
            -e LISTEN_HOST=0.0.0.0 \
            -e PORT=3456 \
            takealot/store-monitor:production >/dev/null

          # Replace the legacy entrypoint name and start TLS + renewal from the
          # version-controlled production Compose configuration.
          docker rm -f erp-nginx >/dev/null 2>&1 || true
          docker compose up -d --no-deps nginx

          certbot_contact=(--register-unsafely-without-email)
          if [ -n "${CERTBOT_EMAIL:-}" ]; then
            certbot_contact=(--email "$CERTBOT_EMAIL")
          fi

          ensure_certificate_domains() {
            local cert_name="$1"
            shift
            local domains=("$@")
            local domain=''
            local certbot_domains=()

            for domain in "${domains[@]}"; do
              certbot_domains+=(-d "$domain")
            done

            docker compose run -T --rm --no-deps --entrypoint certbot certbot \
              certonly --webroot --webroot-path=/var/www/certbot \
              --cert-name "$cert_name" --expand --non-interactive --agree-tos \
              "${certbot_contact[@]}" "${certbot_domains[@]}" </dev/null
          }

          ensure_certificate_domains erp.sztekeluo.com \
            erp.sztekeluo.com www.erp.sztekeluo.com
          ensure_certificate_domains oms.sztekeluo.com \
            oms.sztekeluo.com www.oms.sztekeluo.com
          # Recreate the public TLS process so it opens the renewed certificate
          # files instead of continuing to serve the certificates loaded at boot.
          docker compose restart nginx
          docker compose up -d --no-deps certbot

          wait_healthy() {
            local container="$1"
            local status=''
            for _ in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              if [ "$status" = healthy ] || [ "$status" = running ]; then
                echo "$container: $status"
                return 0
              fi
              if [ "$status" = unhealthy ] || [ "$status" = exited ] || [ "$status" = dead ]; then
                docker logs --tail 100 "$container" || true
                return 1
              fi
              sleep 5
            done
            echo "$container did not become healthy (last status: $status)"
            docker logs --tail 100 "$container" || true
            return 1
          }

          wait_healthy oms-api
          wait_healthy oms-web
          wait_healthy erp-api
          wait_healthy erp-web

          cd /opt/system/erp
          echo '=== Customer import via running erp-api ==='
          test -f backend/data/customers-import.json || { echo 'Missing customers-import.json'; exit 1; }
          load_env_file /opt/system/erp/.env
          test -n "${OMS_INTERNAL_TOKEN:-}" || { echo 'OMS_INTERNAL_TOKEN missing on server'; exit 1; }
          erp_api_cid="$(docker compose ps -q erp-api)"
          test -n "$erp_api_cid" || { echo 'erp-api container not running'; exit 1; }
          docker exec "$erp_api_cid" mkdir -p /app/data </dev/null || true
          docker cp backend/data/customers-import.json "${erp_api_cid}:/app/data/customers-import.json"
          docker exec -u 0 "$erp_api_cid" chmod 644 /app/data/customers-import.json </dev/null
          import_json="$(
            curl --fail --silent --show-error --max-time 600 \
              -X POST https://www.erp.sztekeluo.com/api/customers/oms/import-legacy \
              -H "Content-Type: application/json" \
              -H "x-oms-internal-token: ${OMS_INTERNAL_TOKEN}" \
              -d '{}'
          )"
          printf '%s\n' "$import_json"
          IMPORT_JSON="$import_json" python3 -c "import json,os,sys; payload=json.loads(os.environ['IMPORT_JSON']); data=payload.get('data') or payload; keys=('total','created','updated','failed','linked'); print('import result:', {k: data.get(k) for k in keys}); linked=int(data.get('linked') or 0); sys.exit('OMS linked customers below 200: %s' % linked) if linked < 200 else None"

          wait_healthy takealot-monitor
          wait_healthy nginx

          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://www.oms.sztekeluo.com/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://www.erp.sztekeluo.com/api/auth/health >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://www.erp.sztekeluo.com/takealot-monitor/health >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://oms.sztekeluo.com/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://erp.sztekeluo.com/api/auth/health >/dev/null
          REMOTE

      - name: Verify public TLS certificates
        run: |
          set -Eeuo pipefail

          verify_certificate_sans() {
            local host="$1"
            shift
            local certificate=''
            local expected_domain=''

            certificate="$(
              openssl s_client -servername "$host" -connect "${host}:443" </dev/null 2>/dev/null \
                | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
            )"
            printf '%s\n' "=== ${host} ===" "$certificate"

            for expected_domain in "$@"; do
              grep -Fq "DNS:${expected_domain}" <<<"$certificate" || {
                echo "Certificate served by ${host} is missing DNS:${expected_domain}" >&2
                return 1
              }
            done
          }

          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            https://erp.sztekeluo.com/api/auth/health >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            https://oms.sztekeluo.com/ >/dev/null
          verify_certificate_sans erp.sztekeluo.com \
            erp.sztekeluo.com www.erp.sztekeluo.com
          verify_certificate_sans oms.sztekeluo.com \
            oms.sztekeluo.com www.oms.sztekeluo.com

      - name: Deployment summary
        run: |
          echo "### Production deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ERP: https://www.erp.sztekeluo.com/" >> "$GITHUB_STEP_SUMMARY"
          echo "- OMS: https://www.oms.sztekeluo.com/" >> "$GITHUB_STEP_SUMMARY"
